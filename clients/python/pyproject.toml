[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "maexchen_client"

[project]
name = "maexchen-python-client"
version = "0.0.1"
description = ""
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = [ "pytest>=9.0" ]
lint = [ "ruff>=0.15", "mypy>=1.19", "ty>=0.0.98" ]

[project.scripts]
maexchen-bot = "maexchen_client.main:main"

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "venv",
]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "C4", "C90", "D", "E", "F", "FURB", "I", "ISC", "N", "PERF", "PIE", "PL", "PT", "RET",
    "RUF", "S", "SIM", "T20", "TC", "TRY", "UP", "W",
]
ignore = [
    "D102",   # the bots override one documented method
    "D105",
    "D107",
    "S311",   # random is no security feature here
    "TRY003", # short messages in exceptions are fine
]
mccabe.max-complexity = 10
pydocstyle.convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "PLR2004", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["maexchen_client", "conftest"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"
root = ["src", "tests"]

[tool.mypy]
files = ["src", "tests"]
strict = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = ["src"]
