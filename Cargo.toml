[workspace]
resolver = "3"
members = ["server", "spectator"]
exclude = ["clients/rust", "server/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = { version = ">=1.0.80", default-features = false }
clap = { version = ">=4.4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap-verbosity-flag = { version = ">=3.0.2", default-features = false, features = ["log"] }
derive_more = { version = ">=2.1", default-features = false, features = ["display"] }
log = { version = ">=0.4.20", default-features = false }
log4rs = { version = ">=1.3", default-features = false, features = ["console_appender"] }
rand = { version = ">=0.9", default-features = false, features = ["thread_rng"] }
thiserror = { version = ">=2.0", default-features = false }
tokio = { version = ">=1.30", default-features = false, features = ["net", "rt", "macros", "time", "sync", "signal"] }
uuid = { version = ">=1.4", default-features = false, features = ["v4"] }
criterion = { version = ">=0.5", default-features = false }
proptest = { version = ">=1.4", default-features = false, features = ["std"] }
rstest = { version = ">=0.18", default-features = false }

[profile.release]
strip = "symbols"
opt-level = 3
lto = "fat"
codegen-units = 1
