name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: Rust (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml nutzt unstable_features und imports_granularity, das braucht Nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Server und Spectator
        run: cargo fmt --check
      - name: Rust-Client
        run: cargo fmt --check
        working-directory: clients/rust

  rust-clippy:
    name: Rust (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            clients/rust
      - name: Server und Spectator
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust-Client
        run: cargo clippy --all-targets -- -D warnings
        working-directory: clients/rust

  python-lint:
    name: Python (ruff, mypy, ty)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --group lint --group test
      - name: ruff check
        run: uv run --group lint --group test ruff check src tests
      - name: ruff format
        run: uv run --group lint --group test ruff format --check src tests
      - name: mypy
        run: uv run --group lint --group test mypy
      - name: ty
        run: uv run --group lint --group test ty check

  java-lint:
    name: Java (Spotless, Error Prone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Spotless
        run: ./gradlew spotlessCheck
      - name: Error Prone beim Übersetzen
        run: ./gradlew compileJava compileTestJava

  # 1.88.0 ist rust-version aus Cargo.toml; Nightly darf ausfallen, ohne den Lauf rot zu färben.
  rust-test:
    name: Rust (Tests, ${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: ["1.88.0", stable, nightly]
        include:
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            clients/rust
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
      - name: Server und Spectator
        run: cargo test --workspace
      - name: Rust-Client
        run: cargo test
        working-directory: clients/rust

  python-test:
    name: Python (pytest, ${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run --python ${{ matrix.python }} --group test pytest -q

  # Die Java-Version steht über die Toolchain in build.gradle.kts fest (JDK 21), eine Matrix
  # über mehrere JDKs würde deshalb dieselbe Version mehrfach bauen.
  java-test:
    name: Java (Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  # Ausschlüsse und Workspace stehen in tarpaulin.toml.
  rust-coverage:
    name: Rust (Coverage)
    needs: rust-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            clients/rust
          key: coverage
      - run: cargo tarpaulin --fail-under 90 --out Stdout --out Xml
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: cobertura.xml

  python-coverage:
    name: Python (Coverage)
    needs: python-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run --group test --with coverage coverage run -m pytest -q
      - run: uv run --with coverage coverage report --include='src/*' --fail-under=80

  # Zwei Minuten je Ziel; läuft das häufiger rot, lässt sich der Job wieder entfernen.
  fuzz:
    name: Fuzzing (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_command, game_events]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/fuzz
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=120
        working-directory: server
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: server/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
